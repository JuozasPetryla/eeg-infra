services:
  postgres:
    image: postgres:16-alpine
    container_name: eeg-postgres
    environment:
      POSTGRES_USER: eeg
      POSTGRES_PASSWORD: eeg
      POSTGRES_DB: eeg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eeg -d eeg"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: eeg-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  eeg-be:
    build:
      context: ../eeg-be
      dockerfile: Dockerfile
    container_name: eeg-be
    environment:
      DATABASE_URL: postgresql+psycopg://eeg:eeg@postgres:5432/eeg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: eeg
      DEV_AUTH_BYPASS: "false"
      UVICORN_RELOAD: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  eeg-fe:
    build:
      context: ../eeg-fe
      dockerfile: Dockerfile.aws
    container_name: eeg-fe
    ports:
      - "80:80"
    depends_on:
      eeg-be:
        condition: service_healthy
    restart: unless-stopped

  eeg-ml-pipeline:
    build:
      context: ../eeg-ml-pipeline
      dockerfile: Dockerfile
    container_name: eeg-ml-pipeline
    environment:
      DATABASE_URL: postgresql+psycopg://eeg:eeg@postgres:5432/eeg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: eeg
      JOB_POLL_INTERVAL_SECONDS: 2
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
      eeg-be:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "ml.worker"]

volumes:
  postgres_data:
  minio_data:
